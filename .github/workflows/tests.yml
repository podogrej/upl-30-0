# Automated checks on every pull request to main (pushes alone run nothing: each commit used to be checked twice, as push and as PR).
# A PR that changes only documents (*.md, docs/, LICENSE) runs just the scope job, so checks stays required but costs a minute. Same as running bash tools/tests/all.sh locally,
# split into 4 parallel parts (SHARD), plus the screen comparison with main (visual); the job named checks (required on main) passes only when all of them passed.
name: Перевірки
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false   # never cancel PR checks
jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.d.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: d
        name: Що змінено
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$base" HEAD)
          echo "$files"
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '^(docs/.*|.*\.md|LICENSE)$'; then echo "code=false" >> "$GITHUB_OUTPUT"; else echo "code=true" >> "$GITHUB_OUTPUT"; fi
  part:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Шрифти й Postgres
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-core $([ ${{ matrix.shard }} = 1 ] && echo postgresql)
      - name: Залежності інструментів
        working-directory: tools
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Перевірки (частина ${{ matrix.shard }} з 4)
        run: bash tools/tests/all.sh
        env:
          SHARD: ${{ matrix.shard }}/4
      - name: Знімки екрана
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snimky-${{ matrix.shard }}
          path: tools/tests/out/
          retention-days: 7
  # screens look like prod: the same shooter (HEAD copy of visual_diff.js and helpers) photographs main and this build, then compares;
  # a changed screen must be listed in tools/tests/visual_expect.json for the current version
  visual:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: base
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Шрифти
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-core
      - name: Залежності інструментів
        working-directory: tools
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Той самий знімальник у main
        run: ln -s "$PWD/tools/node_modules" base/tools/node_modules && cp tools/tests/visual_diff.js tools/tests/_site.js tools/tests/_page.js base/tools/tests/
      - name: Знімки main
        run: node base/tools/tests/visual_diff.js shoot "$RUNNER_TEMP/vis_base"
      - name: Знімки цієї версії
        run: node tools/tests/visual_diff.js shoot "$RUNNER_TEMP/vis_head"
      - name: Порівняння з main
        run: node tools/tests/visual_diff.js compare "$RUNNER_TEMP/vis_base" "$RUNNER_TEMP/vis_head"
      - name: Змінені екрани (до | після)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ekrany
          path: tools/tests/out/visual/
          retention-days: 7
  checks:
    needs: [scope, part, visual]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Усі частини пройшли
        run: |
          [ "${{ needs.scope.result }}" = success ] || { echo "scope: ${{ needs.scope.result }}"; exit 1; }
          if [ "${{ needs.scope.outputs.code }}" = false ]; then echo "documents only"; exit 0; fi
          [ "${{ needs.part.result }}" = success ] || { echo "part: ${{ needs.part.result }}"; exit 1; }
          case "${{ needs.visual.result }}" in success|skipped) ;; *) echo "visual: ${{ needs.visual.result }}"; exit 1;; esac
