<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=JetBrains+Mono:wght@700&display=swap">
<style>
body{margin:0;background:#000;display:flex;flex-wrap:wrap;gap:0;width:1920px}
.a{width:640px;height:640px;position:relative;overflow:hidden;display:grid;place-items:center;font-family:Unbounded,sans-serif;color:#f4f1ea}
.o{color:#ff7a1a}
#a1{background:radial-gradient(90% 90% at 50% 100%,#1f3a28 0%,#121212 65%)}
#a1 .t{font-weight:900;font-size:150px;line-height:.9;text-align:center;letter-spacing:-.03em}#a1 .t span{display:block;font-size:122px;color:#ff7a1a;margin-top:10px}
#a2{background:#121212}
#a2 .board{background:#0b0b0b;border:10px solid #2a2a2a;border-radius:40px;padding:30px 40px;margin-top:-40px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:160px;color:#ff7a1a;letter-spacing:-.02em;box-shadow:0 0 60px rgba(255,122,26,.25)}
#a2 .lab{position:absolute;bottom:90px;font-size:42px;letter-spacing:.3em;color:#b3aea4}
#a3{background:#ff7a1a}
#a3 .t{font-weight:900;font-size:150px;white-space:nowrap;letter-spacing:-.05em;color:#121212;line-height:1}
#a3 .s{position:absolute;bottom:160px;font-weight:900;font-size:64px;color:#121212;letter-spacing:.05em}
#a4{background:#1b4a30}
#a4 svg{position:absolute;inset:0}
#a4 .t{position:relative;font-weight:900;font-size:170px;letter-spacing:-.04em;text-shadow:0 6px 0 rgba(0,0,0,.25)}
#a5{background:#121212}
#a5 .ring{width:470px;height:470px;border-radius:50%;border:26px solid #ff7a1a;display:grid;place-items:center}
#a5 .t{font-weight:900;font-size:100px;letter-spacing:-.04em}
#a5 .s{position:absolute;bottom:185px;font-size:40px;font-weight:700;color:#ff7a1a;letter-spacing:.2em}
#a6{background:linear-gradient(135deg,#121212 0 50%,#ff7a1a 50% 100%)}
#a6 .t1{position:absolute;left:110px;top:120px;font-weight:900;font-size:170px;color:#f4f1ea}
#a6 .t2{position:absolute;right:120px;bottom:110px;font-weight:900;font-size:190px;color:#121212}
.n{position:absolute;top:18px;left:22px;font:700 34px 'JetBrains Mono',monospace;color:#fff;background:rgba(0,0,0,.5);border-radius:10px;padding:2px 12px;z-index:5}
</style></head><body>
<div class="a" id="a1"><div class="n">1</div><div class="t">30-0<span>УПЛ</span></div></div>
<div class="a" id="a2"><div class="n">2</div><div class="board">30:0</div><div class="lab">УПЛ</div></div>
<div class="a" id="a3"><div class="n">3</div><div class="t">30-0</div><div class="s">УПЛ</div></div>
<div class="a" id="a4"><div class="n">4</div><svg viewBox="0 0 640 640"><g fill="none" stroke="rgba(255,255,255,.35)" stroke-width="6"><line x1="0" y1="320" x2="640" y2="320"/><circle cx="320" cy="320" r="120"/><rect x="190" y="-10" width="260" height="120"/><rect x="190" y="530" width="260" height="120"/></g></svg><div class="t">30<span class="o">-</span>0</div></div>
<div class="a" id="a5"><div class="n">5</div><div class="ring"><div class="t">30-0</div></div><div class="s">УПЛ</div></div>
<div class="a" id="a6"><div class="n">6</div><div class="t1">30</div><div class="t2">0</div></div>
</body></html>
